<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .circle { mix-blend-mode: screen; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; fill: #f0f0f0; }
      .center-label { font-family: 'DM Serif Display', Georgia, serif; fill: #080808; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#080808" />

  <!-- Computer Graphics -->
  <circle class="circle" cx="410" cy="255" r="150" fill="#22d3ee" fill-opacity="0.55" />
  <!-- Image Processing -->
  <circle class="circle" cx="550" cy="255" r="150" fill="#f472b6" fill-opacity="0.55" />
  <!-- Computer Vision -->
  <circle class="circle" cx="480" cy="375" r="150" fill="#c8ff00" fill-opacity="0.55" />

  <!-- Outlines -->
  <circle cx="410" cy="255" r="150" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="550" cy="255" r="150" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="480" cy="375" r="150" fill="none" stroke="#c8ff00" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Labels -->
  <text class="label" x="290" y="150" font-size="20" text-anchor="middle">Computer</text>
  <text class="label" x="290" y="174" font-size="20" text-anchor="middle">Graphics</text>

  <text class="label" x="670" y="150" font-size="20" text-anchor="middle">Image</text>
  <text class="label" x="670" y="174" font-size="20" text-anchor="middle">Processing</text>

  <text class="label" x="480" y="500" font-size="20" text-anchor="middle">Computer Vision</text>

  <!-- Center highlight for triple intersection -->
  <text class="center-label" x="480" y="300" font-size="18" text-anchor="middle">O que a</text>
  <text class="center-label" x="480" y="324" font-size="18" text-anchor="middle">disciplina</text>
  <text class="center-label" x="480" y="348" font-size="18" text-anchor="middle">aborda</text>
</svg>
