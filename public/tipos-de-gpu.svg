<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'DM Serif Display', Georgia, serif; fill: #f0f0f0; }
      .caption { font-family: 'DM Sans', system-ui, sans-serif; fill: #707070; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; fill: #b0b0b0; }
      .strong { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; fill: #f0f0f0; }
      .tag { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.04em; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#080808" />
<text class="title" x="60" y="52" font-size="26">Três tipos de GPU</text>
<text class="caption" x="60" y="80" font-size="14">O que muda é onde ela vive e de onde vem a memória</text>
<rect x="60" y="120" width="270" height="380" fill="#111111" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5"/>
<text class="strong" x="80" y="156" font-size="19">Integrada</text>
<rect x="135.0" y="185" width="120" height="80" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/>
<rect x="147.0" y="197" width="48" height="56" fill="#818cf8" fill-opacity="0.3" stroke="#818cf8"/>
<rect x="199.0" y="197" width="44" height="56" fill="#34d399" fill-opacity="0.35" stroke="#34d399"/>
<text class="label" x="171.0" y="229" font-size="12" text-anchor="middle">CPU</text>
<text class="label" x="221.0" y="229" font-size="12" text-anchor="middle">GPU</text>
<text class="tag" x="80" y="310" font-size="11" fill="#34d399">ONDE VIVE</text>
<text class="label" x="80" y="330" font-size="13">No mesmo chip ou pacote da CPU</text>
<text class="tag" x="80" y="365" font-size="11" fill="#34d399">MEMÓRIA</text>
<text class="label" x="80" y="385" font-size="13">Compartilha a RAM do sistema</text>
<text class="tag" x="80" y="420" font-size="11" fill="#34d399">MELHOR PARA</text>
<text class="label" x="80" y="440" font-size="13">Laptops, celulares, tablets</text>
<rect x="355" y="120" width="270" height="380" fill="#111111" stroke="#fb923c" stroke-opacity="0.45" stroke-width="1.5"/>
<text class="strong" x="375" y="156" font-size="19">Discreta</text>
<rect x="420.0" y="193" width="140" height="64" fill="#fb923c" fill-opacity="0.1" stroke="#fb923c" stroke-width="1.5"/>
<circle cx="462.0" cy="225" r="20" fill="none" stroke="#fb923c" stroke-width="2"/>
<circle cx="462.0" cy="225" r="6" fill="#fb923c"/>
<rect x="498.0" y="207" width="12" height="36" fill="#fb923c" fill-opacity="0.5"/>
<rect x="515.0" y="207" width="12" height="36" fill="#fb923c" fill-opacity="0.5"/>
<rect x="532.0" y="207" width="12" height="36" fill="#fb923c" fill-opacity="0.5"/>
<text class="label" x="516.0" y="279" font-size="11" text-anchor="middle">VRAM</text>
<rect x="430.0" y="257" width="60" height="8" fill="#fb923c" fill-opacity="0.6"/>
<text class="tag" x="375" y="310" font-size="11" fill="#fb923c">ONDE VIVE</text>
<text class="label" x="375" y="330" font-size="13">Em placa de vídeo própria</text>
<text class="tag" x="375" y="365" font-size="11" fill="#fb923c">MEMÓRIA</text>
<text class="label" x="375" y="385" font-size="13">VRAM dedicada</text>
<text class="tag" x="375" y="420" font-size="11" fill="#fb923c">MELHOR PARA</text>
<text class="label" x="375" y="440" font-size="13">Jogos de ponta, 3D, IA local</text>
<rect x="650" y="120" width="270" height="380" fill="#111111" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.5"/>
<text class="strong" x="670" y="156" font-size="19">Virtual (nuvem)</text>
<path d="M735.0 237 a22 22 0 0 1 8 -42 a30 30 0 0 1 56 -8 a24 24 0 0 1 28 50 z" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.5"/>
<rect x="743.0" y="247" width="22" height="26" fill="#818cf8" fill-opacity="0.35" stroke="#818cf8"/>
<rect x="773.0" y="247" width="22" height="26" fill="#818cf8" fill-opacity="0.35" stroke="#818cf8"/>
<rect x="803.0" y="247" width="22" height="26" fill="#818cf8" fill-opacity="0.35" stroke="#818cf8"/>
<text class="tag" x="670" y="310" font-size="11" fill="#818cf8">ONDE VIVE</text>
<text class="label" x="670" y="330" font-size="13">Em um data center, acesso</text>
<text class="label" x="670" y="347" font-size="13">remoto</text>
<text class="tag" x="670" y="382" font-size="11" fill="#818cf8">MEMÓRIA</text>
<text class="label" x="670" y="402" font-size="13">Memória alocada no hardware</text>
<text class="label" x="670" y="419" font-size="13">hospedeiro</text>
<text class="tag" x="670" y="454" font-size="11" fill="#818cf8">MELHOR PARA</text>
<text class="label" x="670" y="474" font-size="13">IA, renderização remota</text></svg>
